<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/styles/styles.css" type="text/css" rel="stylesheet">
    <title>Create New Animal</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light" style="background-color: #e3f2fd;">
    <ul class="nav justify-content-end">
        <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/animals/all">Home</a>
        </li>
    </ul>
</nav>

<h1>Create New Animal</h1>
<form id="new-animal" action="/animals/new" method="post">


    <input type="text" id="name" name="name" placeholder="Name" >


    <input type="text" id="scientificName" name="scientificName" placeholder="Scientific Name">


    <input type="text" id="species" name="species" placeholder="Species">


    <input type="text" id="habitat" name="habitat" placeholder="Habitat">

    <input type="text" id="description" name="description" placeholder="Description">

    <button type="submit" class="btn btn-primary">Create</button>
    <button type="button" class="btn btn-danger" onclick="/animals/all'">Cancel</button>
</form>
</body>
</html>
